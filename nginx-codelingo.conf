# ==============================================================================
# CodeLingo - Configuración Nginx para subruta /app/CodeLingo
# ==============================================================================
# Instrucciones de integración:
# 1. Copia este archivo o incluye su contenido dentro de tu bloque 'server { ... }'
#    donde ya corre tu aplicación Angular (puerto 80 o 443).
#    Ejemplo en /etc/nginx/sites-available/default:
#        include /etc/nginx/conf.d/codelingo.conf;
# 2. Verifica con: sudo nginx -t
# 3. Recarga con:  sudo systemctl reload nginx
# ==============================================================================

location ^~ /app/CodeLingo {
    alias /var/www/app/CodeLingo/dist;
    index index.html;
    
    # Manejo de SPA (Single Page Application) para que no choque con Angular
    try_files $uri $uri/ /app/CodeLingo/index.html;

    # Headers de seguridad y compresión básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Cache agresivo para assets compilados por Vite (inmutables con hash)
    location ~* \.(?:js|css|svg|woff2?|ttf|eot|png|jpe?g|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
