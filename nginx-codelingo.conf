# ==============================================================================
# CodeLingo - Configuración Nginx para subruta /CodeLingo
# ==============================================================================
# Ubicación: /etc/nginx/snippets/codelingo.conf
# Se incluye dentro del bloque 'server { ... }' activo (sin tocar taji/Angular):
#      include /etc/nginx/snippets/codelingo.conf;
# ==============================================================================

# 1. Enrutamiento principal de la aplicación React SPA
location ^~ /CodeLingo {
    alias /var/www/CodeLingo/dist/;
    index index.html;
    
    # Manejo de Single Page Application (React) sin tocar la raíz de Angular
    try_files $uri $uri/ /CodeLingo/index.html;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# 2. Assets estáticos compilados con hash inmutable (JS, CSS, SVGs, etc.)
location ^~ /CodeLingo/assets/ {
    alias /var/www/CodeLingo/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
