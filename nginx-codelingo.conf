# ==============================================================================

# CodeLingo - Configuración Nginx para subruta /CodeLingo

# ==============================================================================

# Ubicación: /etc/nginx/snippets/codelingo.conf

# Se incluye dentro del bloque 'server { ... }' activo (sin tocar taji/Angular):

#      include /etc/nginx/snippets/codelingo.conf;

# ==============================================================================



# 1. Normalización de URL (evitar que /CodeLingo sin barra caiga en Angular taji)

location = /CodeLingo {

    return 301 /CodeLingo/;

}



location ~* ^/codelingo/?$ {

    return 301 /CodeLingo/;

}



# 2. Enrutamiento principal de la aplicación React SPA

location ^~ /CodeLingo/ {

    alias /root/app/CodeLingo/dist/;

    index index.html;

    

    # Manejo de Single Page Application (React) sin tocar la raíz de Angular

    try_files $uri $uri/ /CodeLingo/index.html;



    # Headers de seguridad

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header X-Content-Type-Options "nosniff" always;

}



# 3. Assets estáticos compilados con hash inmutable (JS, CSS, SVGs, etc.)

location ^~ /CodeLingo/assets/ {

    alias /root/app/CodeLingo/dist/assets/;

    expires 1y;

    add_header Cache-Control "public, max-age=31536000, immutable";

    access_log off;

}



# 4. API JSON: route only /CodeLingo/api/ to Laravel.

# Confirm the PHP-FPM socket on your VPS before enabling this block.

location ^~ /CodeLingo/api/ {

    client_max_body_size 1100k;

    # CORS: permite llamadas desde el entorno local de desarrollo (npm run dev)
    # y desde la misma app en producción.
    set $cors_origin "";
    if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
        set $cors_origin $http_origin;
    }
    if ($http_origin = "https://167.86.106.105") {
        set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept, X-CSRF-TOKEN, X-Account-ID, X-Requested-With" always;

    # Responder preflight OPTIONS directamente (sin pasar a PHP)
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, X-CSRF-TOKEN, X-Account-ID, X-Requested-With" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    rewrite ^/CodeLingo(/api/.*)$ $1 break;

    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME /var/www/CodeLingo/backend/public/index.php;

    fastcgi_param SCRIPT_NAME /index.php;

    fastcgi_param REQUEST_URI $uri$is_args$args;

    fastcgi_param HTTP_PROXY "";

    include /etc/nginx/snippets/codelingo-php.conf;

}


